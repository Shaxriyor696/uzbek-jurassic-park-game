<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Telegram Mini App SDK (rasmiy). Oddiy brauzerda ham zarar qilmaydi; yuklanmasa o‘yin baribir ishlaydi -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <title>Dinoshahar</title>
    <meta name="application-name" content="Dinoshahar" />
    <meta name="apple-mobile-web-app-title" content="Dinoshahar" />
    <meta name="description" content="Dinoshahar — O‘zbekiston muhitidagi shahar qurish va boshqarish o‘yini: uylar, yo‘llar, biznes va xizmat binolarini quring, budjetni boshqaring, aholi ehtiyojlarini qondiring va shaharni atrofdagi dinozavrlardan himoya qiling." />
    <meta property="og:title" content="Dinoshahar" />
    <meta property="og:description" content="O‘zbekiston muhitidagi shahar qurish o‘yini — shaharni dinozavrlardan himoya qiling." />
    <meta property="og:image" content="assets/brand/logo-768.png" />
    <meta name="theme-color" content="#0f2a4d" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Yuklanish ekrani: o‘yin sahnasi tayyor bo‘lguncha  */
      #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(ellipse at center, #24476e 0%, #0f2a4d 70%); transition: opacity 0.5s ease; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #splash img { width: min(440px, 80vw); height: auto; max-height: 60vh; object-fit: contain; }
      #splash p { margin: 0; color: #cfe9fb; font-size: 15px; font-weight: 700; letter-spacing: 0.3px; text-align: center; padding: 0 16px; }
      #splash.hide { opacity: 0; pointer-events: none; }
      /* Brauzer ovozni bloklaganda: shahar tayyor — bosish kutiladi (bo‘kirish shu bosishdan) */
      #splash p.tap { animation: splash-tap 1.6s ease-in-out infinite; }
      @keyframes splash-tap { 50% { opacity: 0.55; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-live="polite">
      <img src="assets/brand/logo-768.png" alt="Dinoshahar" />
      <p>Shahar yuklanmoqda…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
