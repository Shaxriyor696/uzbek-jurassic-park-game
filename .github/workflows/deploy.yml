# Avtomatik deploy (main ga push qilinganda):
#  1) O'yin — GitHub Pages (bepul, HTTPS)
#  2) Bot va saqlash serveri — Cloudflare Worker + D1 (bepul tarif), CLOUDFLARE_API_TOKEN secret bo'lsa
#  3) Bot buyruqlari, menyu tugmasi va webhook — scripts/telegram-setup.mjs
# Kerakli GitHub sozlamalari (Settings → Secrets and variables → Actions):
#   Secrets:   BOT_TOKEN, WEBHOOK_SECRET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: API_PUBLIC_URL (Worker manzili), D1_DATABASE_ID
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_PUBLIC_URL }}
      - name: Token buildga tushmaganini tekshirish
        run: "! grep -rqE 'bot[0-9]{6,}:|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' dist"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  worker:
    runs-on: ubuntu-latest
    needs: pages
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: D1 bazasi identifikatori
        if: env.HAS_CF == 'true'
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ vars.D1_DATABASE_ID }}/" server/wrangler.toml
      - name: Worker deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          preCommands: npx wrangler d1 execute ujp-saves --remote --file schema.sql
          command: deploy --var WEB_APP_URL:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ --var ALLOWED_ORIGIN:https://${{ github.repository_owner }}.github.io
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      - name: Bot sozlamalari (buyruqlar, menyu tugmasi, webhook)
        if: env.HAS_CF == 'true'
        run: node scripts/telegram-setup.mjs --webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEB_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
